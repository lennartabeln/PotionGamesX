# PotionGames Chest Loot Configuration
# Defines loot tables for chests found in-game
# factor: 1.0 = default density, 0.5 = half, 2.0 = double

pg:
  chestloot:
    normal:
      loot:
        factor: 1.0
        food1: 20.0
        food2: 10.0
        armour1: 15.0
        armour2: 15.0
        armour3: 7.0
        armour4: 5.0
        armour5: 3.0
        weapons1: 20.0
        weapons2: 5.0
        # Shop currency (glass bottle + coin). Only rolled while the lobby has
        # its shop enabled; otherwise the roll becomes food.
        shop: 10.0

      items:
        food1:
          - "CAKE:1"
          - "BREAD:3"
          - "PUMPKIN_PIE:3"
          - "COOKIE:3"
          - "BAKED_POTATO:3"
        food2:
          - "RABBIT_STEW:1"
          - "MUSHROOM_STEW:1"
          - "BEETROOT_SOUP:1"
          - "GOLDEN_CARROT:1"
          - "MILK_BUCKET:1"
        armour1:
          - "LEATHER_HELMET:1"
          - "LEATHER_CHESTPLATE:1"
          - "LEATHER_LEGGINGS:1"
          - "LEATHER_BOOTS:1"
        armour2:
          - "CHAINMAIL_HELMET:1"
          - "CHAINMAIL_CHESTPLATE:1"
          - "CHAINMAIL_LEGGINGS:1"
          - "CHAINMAIL_BOOTS:1"
        armour3:
          - "GOLDEN_HELMET:1"
          - "GOLDEN_CHESTPLATE:1"
          - "GOLDEN_LEGGINGS:1"
          - "GOLDEN_BOOTS:1"
        armour4:
          - "IRON_HELMET:1"
          - "IRON_CHESTPLATE:1"
          - "IRON_LEGGINGS:1"
          - "IRON_BOOTS:1"
        armour5:
          - "DIAMOND_HELMET:1"
          - "DIAMOND_CHESTPLATE:1"
          - "DIAMOND_LEGGINGS:1"
          - "DIAMOND_BOOTS:1"
        weapons1:
          - "FISHING_ROD:1"
          - "BOW:1"
          - "ARROW:5"
          - "SPECTRAL_ARROW:1"
          - "SHIELD:1"
          - "FLINT_AND_STEEL:1"
          - "COBWEB:3"
          - "TNT:1"
          - "WOODEN_SWORD:1"
          - "STONE_SWORD:1"
          - "WOODEN_AXE:1"
          - "STONE_AXE:1"
        weapons2:
          - "GOLDEN_SWORD:1"
          - "IRON_SWORD:1"
          - "GOLDEN_AXE:1"
          - "IRON_AXE:1"
          - "DIAMOND_SWORD:1"
          - "DIAMOND_AXE:1"
          - "COMPASS:1"
          - "REDSTONE_TORCH:1"

  # Chest block types: right-clicking one of these blocks opens a chest.
  # A single material name or a list of material names is supported.
  chestblocks:
    normal:
      - "END_PORTAL_FRAME"
    shop:
      - "COMPOSTER"

  # Custom chest loot profiles.
  # Entries are seeded automatically on startup when missing, so the special
  # chest blocks (command block, target, netherite block, dried kelp block)
  # work out of the box. Delete an entry to stop it from being re-added and
  # restart the server, or edit an existing entry freely.
  customchests: {}
