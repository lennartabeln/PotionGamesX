# PotionGames Configuration File
# Minecraft Paper 26.3.x
#
# Data Organization:
#   config.yml (this file): Global settings, database, feature toggles
#   lobbies.yml: Lobbies, arenas, spawns (all locations)
#   chests.yml: Chest loot item definitions
#   messages.yml: Localized text messages
#   kits.yml: Kit definitions
#   shop.yml: Shop items

pg:
  # ═══════════════════════════════════════════════════════
  # CORE SETTINGS
  # ═══════════════════════════════════════════════════════

  gameServer: false
  language: en_US

  # Single-lobby compatibility mode (legacy behaviour): the setup commands accept
  # their short form without a lobby number and always target lobby 1
  # (/pg addarena <arena> instead of /pg addarena <lobby> <arena>).
  singleLobby: false

  # BungeeCord / Proxy network support
  # When game ends, players are sent back to this server
  bungeeServer: hub

  # ═══════════════════════════════════════════════════════
  # DATABASE CONFIGURATION
  # ═══════════════════════════════════════════════════════

  activateMySQL: false
  mysql:
    host: localhost
    port: 3306
    database: potiongames
    user: root
    password: "admin"

  # ═══════════════════════════════════════════════════════
  # DEFAULT GAME SETTINGS
  # (Applied to all lobbies unless overridden per lobby in lobbies.yml)
  #
  # Everything below can be overridden per lobby:
  #   lobbies.yml -> pg.lobbies.<id>.settings.<key>
  # The remaining feature flags further down (activateDeathmatch,
  # activateScoreboard, changeGamerules, friendlyFire) are global only.
  # ═══════════════════════════════════════════════════════

  defaults:
    # Timing
    countdown: 60              # Seconds before game starts
    roundTime: 30              # Minutes per round

    # Player limits
    maxPlayers: 24             # Upper bound; the effective capacity is capped by
                               # the smallest usable arena spawn count
    minPlayers: 2
    teamSize: 2

    # Feature flags
    activateAirdrops: true
    activateKits: true
    activateShop: true
    activateTeams: true

  # ═══════════════════════════════════════════════════════
  # GLOBAL FEATURES
  # ═══════════════════════════════════════════════════════

  # Gameplay
  activateDeathmatch: true
  activateScoreboard: true
  broadcastStarting: false
  changeGamerules: true
  friendlyFire: false
  joinStarted: false

  # Player behavior
  allowOutsideChat: false
  compassOnSpawn: false
  startOnJoin: false

  # Economy (optional, uses Vault). Without Vault the flags stay on but
  # no money moves - the plugin does not disable itself.
  enableRewards: false
  killReward: 10               # Coins per kill
  winningReward: 100           # Coins for winning a round

  # Content limits
  activeKits: 6                # Selectable kits, counted from the entries in kits.yml
  activePotions: 0             # Shop entries shown and buyable (0 = all entries of shop.yml)

  # ═══════════════════════════════════════════════════════
  # LEGACY KEYS
  # Installs that still carry the pre-1.0 layout are migrated automatically:
  # pg.Lobby.coords, pg.Lobby.sign, pg.lobbySystem, pg.arenas and the old
  # per-lobby keys under pg.lobbies.* are read once and written to the new
  # files. They do not have to exist in this file.
  # ═══════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════
  # STATS WALL (optional)
  # The plugin writes these keys itself when an admin runs
  # /pg headp1|headp2|headp3 and /pg signp1|signp2|signp3 while
  # looking at the block. They stay absent until the first use, so
  # nothing has to be prepared here. Example of what gets written:
  #
  # RankWall:
  #   headp1:
  #     world: world
  #     x: 12.5
  #     y: 64.0
  #     z: -7.5
  #     pitch: 0.0
  #     yaw: 90.0
  # ═══════════════════════════════════════════════════════
